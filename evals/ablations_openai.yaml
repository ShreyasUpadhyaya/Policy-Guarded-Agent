# FULL tier: 5 variants x 40 tasks x 4 trials = 800 simulations, gpt-4.1-mini for
# agent and user (the tau2 judge stays on hardcoded gpt-4.1). Ask before running.
#
# Run once on 2026-09-23 (evals/results/ablation_full_openai.json). The prepaid
# OpenAI credit ran out partway through the run, so only baseline produced usable
# data. See docs/RESULTS.md, "Attempted 40x4 run".

variants:
  - name: baseline-openai
    agent: guarded_agent_baseline
    domain: retail
    llm_agent: gpt-4.1-mini
    llm_user: gpt-4.1-mini
    num_tasks: 40
    num_trials: 4
    seed: 300

  - name: "+registry-openai"
    agent: guarded_agent_registry
    domain: retail
    llm_agent: gpt-4.1-mini
    llm_user: gpt-4.1-mini
    num_tasks: 40
    num_trials: 4
    seed: 300

  - name: "+policy_checker-openai"
    agent: guarded_agent_policy_checker
    domain: retail
    llm_agent: gpt-4.1-mini
    llm_user: gpt-4.1-mini
    num_tasks: 40
    num_trials: 4
    seed: 300

  - name: "+critic-openai"
    agent: guarded_agent_critic
    domain: retail
    llm_agent: gpt-4.1-mini
    llm_user: gpt-4.1-mini
    num_tasks: 40
    num_trials: 4
    seed: 300

  - name: full-openai
    agent: guarded_agent
    domain: retail
    llm_agent: gpt-4.1-mini
    llm_user: gpt-4.1-mini
    num_tasks: 40
    num_trials: 4
    seed: 300
