# Template, never run: the five cumulative ablation variants with Gemini as the
# agent/user model. See docs/GEMINI_INTEGRATION.md.
#
# - gemini-3.6-flash's free tier (5 requests/minute) failed a single real task
#   (docs/EVALUATION.md); this only makes sense with a paid Gemini quota.
# - The tau2 NL-assertion judge stays on gpt-4.1 (hardcoded), so OPENAI_API_KEY is
#   still required and every graded simulation still spends OpenAI credit.
# - 25 simulations: SMOKE-sized, but still confirm the spend first (see the budget
#   notes in PLAN.md / evals/results/COSTS.md).

variants:
  - name: baseline-gemini
    agent: guarded_agent_baseline
    domain: retail
    llm_agent: gemini/gemini-3.6-flash
    llm_user: gemini/gemini-3.6-flash
    num_tasks: 5
    num_trials: 1
    seed: 300

  - name: "+registry-gemini"
    agent: guarded_agent_registry
    domain: retail
    llm_agent: gemini/gemini-3.6-flash
