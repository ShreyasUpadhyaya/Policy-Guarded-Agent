domain: mock
agent_llm: anthropic/claude-haiku-4-5-20251001
user_llm: anthropic/claude-haiku-4-5-20251001
temperature: 0.0
num_trials: 1
num_tasks: 2
max_steps: 200
max_errors: 10
max_concurrency: 3
retry_delay: 1.0
max_retries: 4
save_to: wrapper-smoke

budget:
  # max_tokens is the binding constraint in practice: commit 5's baseline showed
  # real retail tasks use 80k-122k tokens each (evals/results/baseline_smoke/),
  # so 200000 gives headroom above the observed range rather than guessing.
  max_steps: 40
  max_tool_calls: 30
  max_tokens: 200000
  max_wall_clock_seconds: 300

retrieval:
  # Empirically calibrated against the real retail policy.md (guardrails/policy_retrieval.py):
  # correct top-1 matches scored ~0.42-0.46, an off-topic query's best match scored negative.
  # 0.3 sits clearly between the two, not a guess.
  top_k: 3
  min_confidence: 0.3
