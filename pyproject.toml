[project]
name = "guarded-agent"
version = "0.1.0"
description = "A multi-agent, policy-enforcing customer-service agent evaluated on Sierra's tau2-bench."
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
    "tau2",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.0",
]

[tool.uv.sources]
tau2 = { git = "https://github.com/sierra-research/tau2-bench", tag = "v1.0.1" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guarded_agent", "analysis"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts", "analysis"]
strict = true
