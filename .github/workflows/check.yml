name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Shallow-clone vendored tau2-bench
        run: |
          uv sync --group dev
          test -d vendor/tau2-bench || git clone --depth 1 --branch v1.0.1 https://github.com/sierra-research/tau2-bench vendor/tau2-bench

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy

      - name: Test
        env:
          TAU2_DATA_DIR: vendor/tau2-bench/data
        run: uv run pytest
